version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: spectra_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: virtual_tryon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d virtual_tryon"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. pgAdmin (Visual Web Interface for PostgreSQL management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: spectra_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@lenskart.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # 3. FastAPI Python Backend Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spectra_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/virtual_tryon
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  pgdata:
